services:
  app:
    image: gptwrapper:ci
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/postgres
      - PORT=3000
      - AZURE_API_KEY=asdasd
      - AZURE_RESOURCE=asdasd
      - STAGING=true # @todo should we instead be "in production" in ci? needs a little investigation
      - CI=true
      - PUBLIC_URL=http://localhost:8000
    ports:
      - 8000:3000
    container_name: gptwrapper

  db:
    image: docker.io/postgres:15.8-alpine
    environment:
      - PGDATA=/data
      - POSTGRES_PASSWORD=postgres
    ports:
      - 5432:5432
    volumes:
      - pg_data:/data
    container_name: gptwrapper_db

  redis:
    image: redis/redis-stack-server
    container_name: gptwrapper_redis
  
  vectordb:
    image: docker.io/pgvector/pgvector:pg18-trixie
    environment:
      - POSTGRES_DB=rag
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5434:5432'
    volumes:
      - pgvector_data:/data
    container_name: gptwrapper_vectordb

volumes:
  pg_data:
  pgvector_data:
