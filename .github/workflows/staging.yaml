name: Deploy to staging

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'dalai/**'
      - '.github/workflows/dalai.yaml'

jobs:
  test:
    if: ${{ github.actor != 'renovate[bot]' }}
    uses: ./.github/workflows/test.yaml
    secrets: inherit

  build-and-push-to-staging:
    if: ${{ github.actor != 'renovate[bot]' }}
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Build staging image
        id: build-staging-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: gptwrapper
          tags: staging ${{ github.sha }}
          containerfiles: |
            ./Containerfile
          build-args: |
             BASE_PATH=/gptwrapper
             GIT_SHA=${{ github.sha }}
             STAGING=true
          # Extra args are needed to increase the number of open files
          # because of build EMFILE error: https://github.com/npm/cli/issues/4783#issuecomment-1908016260
          extra-args: |
            --ulimit nofile=4096:4096

      - name: Push staging image to version helsinki
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-staging-image.outputs.image }}
          tags: ${{ steps.build-staging-image.outputs.tags }}
          registry: registry.version.helsinki.fi/toska/openshift/kontit/
          username: kontit
          password: ${{ secrets.VERSION_PUSH_SECRET }}


      - name: Print logs on failure
        shell: bash
        if: failure()
        run: docker compose -f compose.ci.yaml logs
